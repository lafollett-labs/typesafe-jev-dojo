<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jev Dojo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    />
    <style>
      :root {
        --bg: #08080d;
        --panel: #0e0f17;
        --panel-2: #12131d;
        --line: #1e2030;
        --text: #e8eaf5;
        --muted: #878ca6;
        --jev: #ff2e97;
        --cyan: #22d3ee;
        --amber: #f8b74d;
        --green: #34d39a;
        --red: #fb5c6c;
        --violet: #a986ff;
        --sans: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
        --display: "Chakra Petch", var(--sans);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        height: 100%;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #0b0c14, #08080d);
        flex-wrap: wrap;
      }
      .brand {
        font-family: var(--display);
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand .dot {
        width: 11px; height: 11px; border-radius: 50%;
        background: var(--jev);
        box-shadow: 0 0 14px var(--jev), 0 0 4px #fff inset;
      }
      .brand small { color: var(--muted); font-family: var(--mono); letter-spacing: 0.05em; font-weight: 400; text-transform: none; font-size: 11px; }
      nav.tabs { display: flex; gap: 6px; margin-left: 4px; }
      nav.tabs button {
        font-family: var(--display);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 13px;
        cursor: pointer;
        transition: color .15s, border-color .15s, background .15s;
      }
      nav.tabs button:hover { color: var(--text); border-color: #2c2f45; }
      nav.tabs button[aria-selected="true"] {
        color: #fff;
        border-color: color-mix(in srgb, var(--jev) 60%, transparent);
        background: color-mix(in srgb, var(--jev) 14%, transparent);
        box-shadow: 0 0 18px color-mix(in srgb, var(--jev) 22%, transparent);
      }
      .badge {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 11px;
        display: flex; align-items: center; gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .badge[data-mode="live"] { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
      .badge[data-mode="live"] .pip { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.6s infinite; }
      .badge[data-mode="sim"] { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
      .badge[data-mode="sim"] .pip { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
      main { position: relative; overflow: hidden; }
      canvas#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      /* Control / HUD dock */
      #dock {
        position: absolute;
        left: 16px; right: 16px; bottom: 16px;
        display: flex; gap: 12px; align-items: flex-end;
        pointer-events: none;
        flex-wrap: wrap;
      }
      #dock > * { pointer-events: auto; }
      .panel {
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
      }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .controls label { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
      .controls input[type="text"] {
        background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
        border-radius: 8px; padding: 8px 10px; font-family: var(--sans); font-size: 13px; min-width: 180px;
      }
      .controls input[type="range"] { accent-color: var(--jev); }
      .btn {
        font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 12px;
        color: #0a0a10; background: var(--jev); border: none; border-radius: 9px; padding: 9px 16px; cursor: pointer;
        box-shadow: 0 0 20px color-mix(in srgb, var(--jev) 40%, transparent); transition: transform .1s, filter .15s;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn:active { transform: translateY(1px); }
      .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); box-shadow: none; }
      .chip { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
      .chip:hover { color: var(--text); border-color: #2c2f45; }
      /* HUD stat tiles */
      #hud { position: absolute; top: 14px; left: 16px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
      .tile { min-width: 96px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 80%, transparent); backdrop-filter: blur(6px); }
      .tile .k { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
      .tile .v { font-family: var(--display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; margin-top: 2px; }
      .tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
      .note { position: absolute; bottom: 16px; right: 16px; max-width: 300px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.5; pointer-events: none; }
      #ledger-toggle {
        margin-left: auto; cursor: pointer; gap: 6px; font-variant-numeric: tabular-nums;
        -webkit-appearance: none; appearance: none; background: transparent; color: #d7dae8;
      }
      #ledger-toggle:hover { color: #fff; border-color: #3a3f57; background: rgba(255,255,255,0.04); }
      #ledger-toggle:focus { outline: none; }
      #ledger-toggle:focus-visible { outline: 2px solid color-mix(in srgb, var(--jev) 60%, transparent); outline-offset: 2px; }
      #lg-req { color: #fff; font-weight: 600; }
      #lg-cost { color: var(--green); }
      #badge { margin-left: 0; }
      /* Ledger drawer */
      #ledger {
        position: absolute; top: 0; right: 0; bottom: 0; width: min(420px, 90vw);
        background: #0b0c14; border-left: 1px solid var(--line); z-index: 20;
        display: flex; flex-direction: column; box-shadow: -24px 0 50px rgba(0,0,0,.55);
      }
      #ledger .lh { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
      #ledger .lh .t { font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; }
      #ledger .lh .path { font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-left: auto; }
      #lg-clear { -webkit-appearance: none; appearance: none; background: transparent; color: #d7dae8; }
      #lg-clear:hover { color: #fff; background: rgba(255,255,255,0.06); border-color: #3a3f57; }
      #lg-clear:focus { outline: none; }
      #lg-clear:focus-visible { outline: 2px solid color-mix(in srgb, var(--jev) 60%, transparent); outline-offset: 2px; }
      #ledger .list { overflow-y: auto; flex: 1; }
      .lx { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,.05); font-family: var(--mono); font-size: 11px; cursor: pointer; }
      .lx:hover { background: rgba(255,255,255,.03); }
      .lx .top { display: flex; gap: 8px; align-items: center; }
      .lx .scene { font-size: 9px; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); flex: 0 0 auto; }
      .lx .in { color: #cfd3e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .lx .sim { color: var(--amber); font-size: 9px; flex: 0 0 auto; }
      .lx .meta { color: var(--muted); display: flex; gap: 12px; margin-top: 4px; font-size: 10px; font-variant-numeric: tabular-nums; }
      .lx .sum { color: #b9bed6; margin-top: 4px; font-size: 10.5px; display: none; white-space: pre-wrap; }
      .lx.open .sum { display: block; }
      .lx.open .in { white-space: normal; }
      [hidden] { display: none !important; }
      @media (max-width: 720px) {
        header { gap: 10px; }
        .brand small { display: none; }
        #hud { top: 10px; left: 10px; gap: 7px; }
        .tile { min-width: 74px; padding: 7px 9px; }
        .tile .v { font-size: 16px; }
        #dock { left: 10px; right: 10px; bottom: 10px; }
        .controls input[type="text"] { min-width: 130px; }
        .note { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand"><span class="dot"></span> Jev&nbsp;Dojo <small id="sub">system-one, live</small></div>
        <nav class="tabs" id="tabs">
          <button data-scene="router" aria-selected="true">Router</button>
          <button data-scene="triage" aria-selected="false">Triage</button>
          <button data-scene="reflex" aria-selected="false">Stacker</button>
          <button data-scene="swarm" aria-selected="false">Swarm</button>
          <button data-scene="gauntlet" aria-selected="false">Gauntlet</button>
        </nav>
        <button id="ledger-toggle" class="badge" type="button" title="Open the transaction ledger">▤ <span id="lg-req">0</span> · <span id="lg-tok">0</span> tok · $<span id="lg-cost">0.0000</span></button>
        <div class="badge" id="badge" data-mode="sim"><span class="pip"></span><span id="badge-text">connecting…</span></div>
      </header>
      <main>
        <canvas id="stage"></canvas>
        <div id="hud"></div>
        <div id="dock"></div>
        <div class="note" id="note"></div>
        <aside id="ledger" hidden>
          <header class="lh">
            <span class="t">Ledger</span>
            <button class="chip" id="lg-clear" type="button">clear view</button>
            <span class="path">logs/transactions.jsonl</span>
          </header>
          <div class="list" id="lg-list"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
